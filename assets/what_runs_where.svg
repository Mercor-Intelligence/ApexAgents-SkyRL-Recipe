<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 716" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6fed"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0e9f6e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="716" fill="#ffffff"/>

  <!-- ======================= LEFT: TASK DATA ======================= -->
  <rect x="20" y="96" width="248" height="326" rx="10" fill="#fcfcfd" stroke="#aaaaaa" stroke-dasharray="5 4"/>
  <text x="32" y="120" font-size="13" font-weight="bold" fill="#1a1a1a">Task data — HF dataset</text>

  <rect x="36" y="134" width="216" height="56" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="144" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HuggingFace dataset</text>
  <text x="144" y="174" font-size="11" fill="#444444" text-anchor="middle">parquet: path · task_binary</text>

  <line x1="144" y1="190" x2="144" y2="208" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="152" y="204" font-size="11" fill="#666666">extract</text>

  <rect x="36" y="214" width="216" height="150" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="10.5" fill="#1a1a1a">
    <text x="48" y="236" font-weight="bold">mercor-409-mk-01/</text>
    <text x="48" y="252">├ instruction.md  <tspan fill="#666666">· prompt</tspan></text>
    <text x="48" y="268">├ task.toml       <tspan fill="#666666">· config</tspan></text>
    <text x="48" y="284">├ archipelago.json</text>
    <text x="48" y="300" fill="#666666">│   · ecr_image (world)</text>
    <text x="48" y="316">└ tests/ <tspan fill="#666666">· verifier +</tspan></text>
    <text x="110" y="332" fill="#666666">grading runner</text>
  </g>
  <text x="36" y="390" font-size="11" fill="#666666">1,928 tasks · 112 worlds (train)</text>
  <text x="36" y="408" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a6d1a">loaded by dataset.py — user code</text>

  <!-- one task dir per trial -->
  <polyline points="252,289 296,289 296,540 356,540" fill="none" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="288" y="415" font-size="11" fill="#555555" text-anchor="middle" transform="rotate(-90 288 415)">one task dir per trial</text>

  <!-- ======================= MIDDLE: GPU CLUSTER ======================= -->
  <rect x="316" y="96" width="428" height="556" rx="12" fill="#fbfbfd" stroke="#888888" stroke-width="1.3"/>
  <text x="332" y="120" font-size="13" font-weight="bold" fill="#1a1a1a">GPU cluster (Ray)</text>
  <rect x="556" y="104" width="176" height="22" rx="11" fill="#edf1fb" stroke="#5a67ad"/>
  <text x="644" y="119" font-size="10.5" font-weight="bold" fill="#3d477e" text-anchor="middle">orchestrated by SkyRL</text>
  <text x="332" y="140" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#8a6d1a">entrypoint: main_tito_harbor_fully_async.py — user code</text>

  <!-- trainer (SkyRL) -->
  <rect x="356" y="150" width="364" height="76" rx="8" fill="#edf1fb" stroke="#5a67ad" stroke-width="1.2"/>
  <text x="538" y="172" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Training nodes</text>
  <text x="538" y="190" font-size="11.5" fill="#1a1a1a" text-anchor="middle">fully async training loop</text>
  <text x="538" y="207" font-size="11.5" fill="#3d477e" text-anchor="middle">Megatron policy workers</text>

  <line x1="538" y1="226" x2="538" y2="250" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="548" y="244" font-size="11" fill="#666666">NCCL weight sync (in-flight)</text>

  <!-- vLLM (SkyRL) -->
  <rect x="356" y="252" width="364" height="76" rx="8" fill="#edf1fb" stroke="#5a67ad" stroke-width="1.2"/>
  <text x="538" y="274" font-size="12.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Inference nodes</text>
  <text x="538" y="292" font-size="11.5" fill="#1a1a1a" text-anchor="middle">vLLM engines · OpenAI-compatible</text>
  <text x="538" y="309" font-size="11.5" fill="#3d477e" text-anchor="middle">/completions → token IDs + logprobs</text>

  <!-- TITO token exchange -->
  <line x1="480" y1="390" x2="480" y2="330" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#ahb)"/>
  <line x1="600" y1="328" x2="600" y2="388" stroke="#2f6fed" stroke-width="1.6" marker-end="url(#ahb)"/>
  <text x="472" y="362" font-size="11" fill="#2f6fed" text-anchor="end">prompt token IDs</text>
  <text x="608" y="355" font-size="11" fill="#2f6fed">sampled tokens</text>
  <text x="608" y="369" font-size="11" fill="#2f6fed">+ logprobs</text>

  <!-- rollout / generator (user code) -->
  <rect x="356" y="390" width="364" height="230" rx="8" fill="#fff8e1" stroke="#b3891f" stroke-width="1.3"/>
  <text x="372" y="412" font-size="12.5" font-weight="bold" fill="#1a1a1a">Rollout — TITOHarborGenerator</text>
  <rect x="628" y="398" width="80" height="20" rx="10" fill="#ffffff" stroke="#b3891f"/>
  <text x="668" y="412" font-size="10" font-weight="bold" fill="#7a5c10" text-anchor="middle">user code</text>
  <text x="372" y="430" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#7a5c10">tito_harbor_generator.py · implements SkyRL GeneratorInterface</text>

  <text x="712" y="440" font-size="10.5" fill="#666666" text-anchor="end">× N concurrent</text>
  <rect x="388" y="444" width="324" height="142" rx="6" fill="#ffffff" stroke="#bbbbbb"/>
  <rect x="380" y="450" width="324" height="142" rx="6" fill="#ffffff" stroke="#999999"/>
  <rect x="372" y="456" width="324" height="142" rx="6" fill="#ffffff" stroke="#666666" stroke-width="1.1"/>
  <text x="534" y="476" font-size="11.5" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1 Ray task per trial · own process</text>

  <rect x="384" y="486" width="300" height="42" rx="5" fill="#e9f6f3" stroke="#2a8f7f" stroke-width="1.1"/>
  <text x="534" y="502" font-size="11" font-weight="bold" fill="#1f6b5f" text-anchor="middle">harbor Trial — rollout lifecycle</text>
  <text x="534" y="517" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#1f6b5f" text-anchor="middle">env start → agent.run() → verify → teardown</text>

  <rect x="384" y="536" width="300" height="46" rx="5" fill="#fff8e1" stroke="#b3891f" stroke-width="1.1"/>
  <text x="534" y="552" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ArchipelagoAgent + TITO loop</text>
  <text x="534" y="568" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#7a5c10" text-anchor="middle">agents/archipelago.py · subclasses harbor BaseAgent</text>

  <text x="538" y="612" font-size="11" fill="#444444" text-anchor="middle">collects tokens · loss mask · logprobs · reward</text>

  <!-- trajectories back to trainer -->
  <polyline points="356,520 336,520 336,188 354,188" fill="none" stroke="#0e9f6e" stroke-width="1.7" marker-end="url(#ahg)"/>
  <text x="328" y="360" font-size="11" fill="#0e9f6e" text-anchor="middle" transform="rotate(-90 328 360)">trajectories + rewards</text>

  <!-- ======================= RIGHT: MODAL SANDBOX ======================= -->
  <text x="1228" y="90" font-size="10.5" fill="#666666" text-anchor="end">× 100s of concurrent trials</text>
  <rect x="798" y="82" width="432" height="470" rx="12" fill="#ffffff" stroke="#cccccc"/>
  <rect x="791" y="89" width="432" height="470" rx="12" fill="#ffffff" stroke="#aaaaaa"/>
  <rect x="784" y="96" width="432" height="470" rx="12" fill="#fdfdfd" stroke="#2a8f7f" stroke-width="1.4"/>
  <text x="800" y="122" font-size="13" font-weight="bold" fill="#1a1a1a">Modal sandbox — one per trial</text>
  <rect x="1030" y="104" width="170" height="22" rx="11" fill="#e9f6f3" stroke="#2a8f7f"/>
  <text x="1115" y="119" font-size="10.5" font-weight="bold" fill="#1f6b5f" text-anchor="middle">lifecycle managed by harbor</text>
  <text x="800" y="140" font-family="Menlo, Consolas, monospace" font-size="9.5" fill="#7a5c10">ecr_modal_env.py — user code, subclasses harbor ModalEnvironment</text>

  <!-- ECR above -->
  <rect x="884" y="16" width="232" height="48" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="1000" y="34" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AWS ECR</text>
  <text x="1000" y="50" font-size="11" fill="#444444" text-anchor="middle">one Docker image per world</text>
  <line x1="1000" y1="64" x2="1000" y2="94" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="1010" y="84" font-size="11" fill="#666666">per-world image pull</text>

  <!-- gateway -->
  <rect x="800" y="152" width="400" height="36" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="1000" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCP gateway (HTTP)</text>
  <line x1="900" y1="188" x2="900" y2="218" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>

  <!-- MCP servers -->
  <rect x="800" y="220" width="400" height="84" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="1000" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCP servers</text>
  <text x="1000" y="260" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Docs · PDF · Excel · PowerPoint · Email · Chat</text>
  <text x="1000" y="277" font-size="11.5" fill="#444444" text-anchor="middle">search · code execution</text>

  <line x1="1000" y1="304" x2="1000" y2="326" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="1010" y="320" font-size="11" fill="#666666">read / write</text>

  <!-- world filesystem -->
  <rect x="800" y="328" width="400" height="60" rx="8" fill="#ffffff" stroke="#555555" stroke-width="1.2"/>
  <text x="1000" y="350" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">World filesystem</text>
  <text x="1000" y="368" font-size="11.5" fill="#444444" text-anchor="middle">PDFs · XLSX · PPTX · emails · chat history</text>

  <line x1="900" y1="388" x2="900" y2="414" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="910" y="408" font-size="11" fill="#666666">agent outputs</text>

  <!-- verifier (harbor) -->
  <rect x="800" y="416" width="400" height="128" rx="8" fill="#e9f6f3" stroke="#2a8f7f" stroke-width="1.2"/>
  <text x="1000" y="438" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Verifier — harbor runs tests/test.sh in-sandbox</text>
  <text x="1000" y="458" font-size="11.5" fill="#1a1a1a" text-anchor="middle">grading runner (ships inside each task)</text>
  <text x="1000" y="476" font-size="11.5" fill="#1a1a1a" text-anchor="middle">LLM judge scores rubric criteria → reward</text>
  <text x="1000" y="494" font-size="10.5" fill="#1f6b5f" text-anchor="middle">+ file snapshot diff for needs_snapshot tasks</text>

  <!-- external judge -->
  <rect x="940" y="576" width="260" height="38" rx="8" fill="#ffffff" stroke="#888888" stroke-dasharray="5 4"/>
  <text x="1070" y="599" font-size="11.5" fill="#1a1a1a" text-anchor="middle">Gemini judge API (external)</text>
  <line x1="1070" y1="544" x2="1070" y2="574" stroke="#555555" stroke-width="1.4" marker-end="url(#ah)"/>
  <text x="1080" y="566" font-size="10.5" fill="#666666">judge calls</text>

  <!-- ======================= CROSS-ZONE ARROWS ======================= -->
  <polyline points="720,505 756,505 756,168 782,168" fill="none" stroke="#555555" stroke-width="1.4"
            marker-end="url(#ah)" marker-start="url(#ah)"/>
  <text x="746" y="330" font-size="11" fill="#555555" text-anchor="middle" transform="rotate(-90 746 330)">MCP tool calls ⇄ results</text>

  <line x1="784" y1="478" x2="722" y2="478" stroke="#0e9f6e" stroke-width="1.7" marker-end="url(#ahg)"/>
  <text x="752" y="470" font-size="11" fill="#0e9f6e" text-anchor="middle">reward</text>

  <line x1="720" y1="545" x2="782" y2="545" stroke="#777777" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ah)"/>
  <text x="752" y="539" font-size="10.5" fill="#666666" text-anchor="middle">launch</text>

  <!-- ======================= LEGEND ======================= -->
  <rect x="24" y="662" width="14" height="14" rx="3" fill="#edf1fb" stroke="#5a67ad"/>
  <text x="44" y="673" font-size="11" fill="#444444">SkyRL — training loop · engines · weight sync (pip-installed, no fork)</text>
  <rect x="450" y="662" width="14" height="14" rx="3" fill="#e9f6f3" stroke="#2a8f7f"/>
  <text x="470" y="673" font-size="11" fill="#444444">harbor — trial + sandbox lifecycle (pip-installed, no fork)</text>
  <rect x="820" y="662" width="14" height="14" rx="3" fill="#fff8e1" stroke="#b3891f"/>
  <text x="840" y="673" font-size="11" fill="#444444">user code — ApexAgents-SkyRL-Recipe (this repo)</text>

  <line x1="24" y1="696" x2="56" y2="696" stroke="#2f6fed" stroke-width="2"/>
  <text x="62" y="700" font-size="11" fill="#444444">token flow (token-in / token-out)</text>
  <line x1="300" y1="696" x2="332" y2="696" stroke="#0e9f6e" stroke-width="2"/>
  <text x="338" y="700" font-size="11" fill="#444444">training signal (trajectories · rewards)</text>
</svg>
